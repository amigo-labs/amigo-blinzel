name: Website

# Builds website/dist and deploys it to Cloudflare Workers (static assets)
# when the secrets exist (docs/PLAN.md, section 14):
#   secret CLOUDFLARE_API_TOKEN   (Workers: edit)
#   secret CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/blinzel-site/**"
      - "CHANGELOG.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - run: cargo run --release -p blinzel-site -- website CHANGELOG.md
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: website
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set: built only, not deployed."
            exit 0
          fi
          npx --yes wrangler@4.149.0 deploy
