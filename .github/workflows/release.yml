name: Release

# Builds the release for a tag v<version>: every platform on GitHub-hosted
# runners (Windows and Linux for x64 and ARM64, macOS as one universal
# app), SHA256SUMS signed with our own Ed25519 key, all attached to the
# tag's GitHub release, which is then published. release-please.yml calls
# this after a release PR is merged (it creates the tag and the draft
# release); by hand, run it for an existing tag.
# Nothing carries a code signing certificate from a CA (docs/PLAN.md,
# section 10): no Authenticode; the Mac app is signed with our own
# self-signed certificate (ad hoc without it) and not notarized.
#
# Needed (docs/PLAN.md, section 14):
#   secret   RELEASE_SIGNING_KEY          Ed25519 seed (blinzel-release keygen)
# Optional:
#   secret   MACOS_SIGNING_CERT           self-signed code signing .p12, base64
#   secret   MACOS_SIGNING_CERT_PASSWORD  its password
#   (organization secrets shared by amigo-labs' Mac apps;
#   packaging/macos/create-signing-cert.sh creates and stores them)

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.1.0)
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Least privilege: only the publish job may write (create the release).
permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: rustup toolchain install && rustup show active-toolchain
      # Third-party actions are pinned to commits: this workflow handles the
      # release signing key.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Crate version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Tag matches the crate version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: test "v$VERSION" = "$TAG" || { echo "tag $TAG != v$VERSION"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p blinzel-app
      - name: Name the setup executable
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/blinzel.exe dist/amigo-blinzel-setup-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: dist/amigo-blinzel-setup-${{ matrix.arch }}.exe

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported Ubuntu: its glibc (2.35) sets the minimum.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: rustup toolchain install && rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: cargo build --release --locked -p blinzel-app
      # The bare executable for the updater, the archive for people.
      - name: Package
        run: |
          mkdir -p dist/amigo-blinzel
          cp target/release/blinzel dist/amigo-blinzel-linux-${{ matrix.arch }}
          cp target/release/blinzel LICENSE THIRD-PARTY-NOTICES-linux.txt dist/amigo-blinzel/
          tar -C dist -czf dist/amigo-blinzel-linux-${{ matrix.arch }}.tar.gz amigo-blinzel
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/amigo-blinzel-linux-${{ matrix.arch }}
            dist/amigo-blinzel-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS (universal)
    runs-on: macos-14
    permissions:
      contents: read
    env:
      # The oldest macOS the app supports (Info.plist says the same).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: rustup toolchain install && rustup target add x86_64-apple-darwin
      # NASM: libjpeg-turbo's and dav1d's x86-64 assembly.
      - run: brew install nasm
      - run: |
          cargo build --release --locked -p blinzel-app --target aarch64-apple-darwin
          cargo build --release --locked -p blinzel-app --target x86_64-apple-darwin
      # Our own self-signed certificate: a stable identity, so macOS keeps
      # the screen recording permission across updates (an ad hoc signature
      # changes with every build). Without the secret: ad hoc.
      - name: Signing identity
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then echo "MACOS_SIGNING_CERT is not set: signing ad hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The keychain holds only the .p12's certificate, whatever its name.
          hash=$(security find-certificate -a -Z "$keychain" | awk '/SHA-1/ {print $NF; exit}')
          test -n "$hash" || { echo "no certificate in MACOS_SIGNING_CERT"; exit 1; }
          # Self-signed: trusted for code signing on this runner only.
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          echo "BLINZEL_MACOS_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
      # The zip is what the updater fetches (core::update::macos_asset_name),
      # the disk image is what people download.
      - name: App bundle and disk image
        run: |
          mkdir dist
          cargo run --release --locked -p blinzel-release -- macos-bundle dist/amigo-blinzel.app \
            target/aarch64-apple-darwin/release/blinzel target/x86_64-apple-darwin/release/blinzel
          lipo -info dist/amigo-blinzel.app/Contents/MacOS/blinzel
          codesign --verify --verbose dist/amigo-blinzel.app
          codesign --display --verbose=2 dist/amigo-blinzel.app 2>&1 | grep -E '^(Authority|Signature)='
          ditto -c -k --keepParent dist/amigo-blinzel.app dist/amigo-blinzel-macos.zip
          cargo run --release --locked -p blinzel-release -- macos-dmg dist/amigo-blinzel.app dist/amigo-blinzel-macos.dmg
          hdiutil verify dist/amigo-blinzel-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/amigo-blinzel-macos.zip
            dist/amigo-blinzel-macos.dmg

  publish:
    name: Checksums and release
    needs: [build, linux, macos]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: sha256sum amigo-blinzel-* > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          cargo run --release -p blinzel-release -- sign dist/SHA256SUMS dist/SHA256SUMS.sig
      # release-please created the tag's release as a draft (with the
      # changelog as notes); the files go up first, then it is published,
      # so the updaters never see a release without its files.
      - name: Attach the files and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          files="dist/amigo-blinzel-* dist/SHA256SUMS dist/SHA256SUMS.sig THIRD-PARTY-NOTICES.txt THIRD-PARTY-NOTICES-linux.txt THIRD-PARTY-NOTICES-macos.txt"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "amigo-blinzel ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" --clobber $files
          gh release edit "$TAG" --draft=false --latest --title "amigo-blinzel ${TAG#v}"
