name: Release

# A tag v<version> builds both architectures on GitHub-hosted runners, writes
# SHA256SUMS signed with our own Ed25519 key and creates a draft release.
# The executables carry no Authenticode signature (docs/PLAN.md, section 10).
#
# Needed (docs/PLAN.md, section 14):
#   secret   RELEASE_SIGNING_KEY       Ed25519 seed (blinzel-release keygen)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Least privilege: only the publish job may write (create the release).
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      # Third-party actions are pinned to commits: this workflow handles the
      # release signing key.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Crate version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p blinzel-app
      - name: Name the setup executable
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/blinzel.exe dist/amigo-blinzel-setup-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: dist/amigo-blinzel-setup-${{ matrix.arch }}.exe

  publish:
    name: Checksums and draft release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: sha256sum amigo-blinzel-setup-*.exe > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          cargo run --release -p blinzel-release -- sign dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "amigo-blinzel ${GITHUB_REF_NAME#v}" \
            --generate-notes dist/amigo-blinzel-setup-*.exe dist/SHA256SUMS dist/SHA256SUMS.sig \
            THIRD-PARTY-NOTICES.txt
