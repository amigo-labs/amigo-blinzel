name: Release

# A tag v<version> builds both architectures on GitHub-hosted runners (SignPath
# checks the build origin), signs them with SignPath when configured, writes
# SHA256SUMS signed with our own Ed25519 key and creates a draft release.
#
# Needed (docs/PLAN.md, section 14):
#   secret   RELEASE_SIGNING_KEY       Ed25519 seed (blinzel-release keygen)
#   secret   SIGNPATH_API_TOKEN        optional until SignPath is set up
#   variable SIGNPATH_ORGANIZATION_ID  optional; signing runs only when set
# SignPath project setup: packaging/signpath/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Least privilege: only the publish job may write (create the release).
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2025
    permissions:
      contents: read
      # SignPath reads the uploaded artifact through the GitHub API.
      actions: read
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      # Third-party actions are pinned to commits: this workflow handles the
      # signing secrets.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Crate version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p blinzel-app
      - name: Name the setup executable
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/blinzel.exe dist/amigo-blinzel-setup-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: unsigned-${{ matrix.arch }}
          path: dist/amigo-blinzel-setup-${{ matrix.arch }}.exe
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: amigo-blinzel
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          # packaging/signpath/artifact-configuration.xml checks the
          # product version against it.
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Keep the signed executable
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp signed/amigo-blinzel-setup-${{ matrix.arch }}.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: dist/amigo-blinzel-setup-${{ matrix.arch }}.exe

  publish:
    name: Checksums and draft release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: sha256sum amigo-blinzel-setup-*.exe > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          cargo run --release -p blinzel-release -- sign dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "amigo-blinzel ${GITHUB_REF_NAME#v}" \
            --generate-notes dist/amigo-blinzel-setup-*.exe dist/SHA256SUMS dist/SHA256SUMS.sig \
            THIRD-PARTY-NOTICES.txt
