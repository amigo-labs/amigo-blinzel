name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (core, fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install NASM (libjpeg-turbo SIMD)
        run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (build, tests, WARP, bench)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo build --release -p blinzel-app
      - name: Exe size
        shell: pwsh
        run: |
          $size = (Get-Item target/release/blinzel.exe).Length
          "blinzel.exe: {0:N0} bytes" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Generate corpus
        run: cargo run --release -p blinzel-bench -- corpus testdata/generated
      - name: Library vs. own code benchmarks
        run: cargo run --release -p blinzel-bench -- run testdata/generated --json bench-libs-windows.json
      # blinzel.exe is a GUI-subsystem program: PowerShell would not wait
      # for it without Start-Process -Wait.
      - name: App benchmark (offscreen, WARP)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/blinzel.exe -ArgumentList '--bench','testdata/generated','--warp','--json','bench-app-windows.json' -Wait -PassThru -NoNewWindow
          Get-Content bench-app-windows.json
          exit $p.ExitCode
      - name: Startup smoke test (window, first frame)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/blinzel.exe -ArgumentList 'testdata/generated/jpeg-24mp-420.jpg','--exit-after-first-frame','--json','bench-startup-windows.json' -Wait -PassThru -NoNewWindow
          if (Test-Path bench-startup-windows.json) { Get-Content bench-startup-windows.json }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bench-and-exe
          path: |
            bench-*.json
            target/release/blinzel.exe
            target/release/blinzel.pdb
            target/warp-golden/
