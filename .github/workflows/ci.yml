name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (core, app, fmt, clippy, tests)
    runs-on: ubuntu-latest
    env:
      # The wgpu golden test must find a GPU: lavapipe, Mesa's software
      # Vulkan (the counterpart of WARP on Windows).
      BLINZEL_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components and targets come from rust-toolchain.toml.
      - run: rustup toolchain install && rustup show active-toolchain
      - name: Install NASM (libjpeg-turbo SIMD), lavapipe, Xvfb and xkbcommon-x11 (winit on X11)
        run: sudo apt-get update && sudo apt-get install -y nasm mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The viewer starts, shows a test image and exits (X11 on Xvfb).
      - name: Linux viewer smoke test
        run: |
          cargo build --release -p blinzel-app
          XDG_RUNTIME_DIR=$RUNNER_TEMP timeout 120 xvfb-run -a ./target/release/blinzel \
            crates/blinzel-core/testdata/rgb420-64x48.avif --exit-after-first-frame --json startup.json
          cat startup.json
          # The display profile published on the X root window (colord, KDE).
          xvfb-run -a sh -c 'BLINZEL_X11_TEST=$DISPLAY cargo test -q --release -p blinzel-app --lib linux::color'
      # Fails when Cargo.lock changed without regenerating the notices.
      - name: Third-party notices up to date
        run: cargo run --locked -p blinzel-release -- notices --check

  windows:
    name: Windows (build, tests, WARP, bench)
    # Windows Server 2025 = build 26100, the same base as Windows 11 24H2.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: ilammy/setup-nasm@v1
      # v1: drops caches holding the libjpeg-turbo built with /Od (see
      # third_party/cmake-rs/README.md).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo build --release -p blinzel-app
      - name: Exe size
        shell: pwsh
        run: |
          $size = (Get-Item target/release/blinzel.exe).Length
          "blinzel.exe: {0:N0} bytes" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Generate corpus
        run: cargo run --release -p blinzel-bench -- corpus testdata/generated
      - name: Library vs. own code benchmarks
        run: cargo run --release -p blinzel-bench -- run testdata/generated --check --json bench-libs-windows.json
      # Upper bound "everything compiled for AVX2". RUSTFLAGS replaces the
      # rustflags from .cargo/config.toml, so crt-static is repeated.
      - name: Benchmarks built for x86-64-v3
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target/x86-64-v3
        run: cargo run --release -p blinzel-bench -- run testdata/generated --quick --json bench-libs-windows-v3.json
      - name: Compare with x86-64-v3
        run: cargo run --release -p blinzel-bench -- compare bench-libs-windows.json bench-libs-windows-v3.json
      # blinzel.exe is a GUI-subsystem program: PowerShell would not wait
      # for it without Start-Process -Wait.
      - name: App benchmark (offscreen, WARP)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/blinzel.exe -ArgumentList '--bench','testdata/generated','--warp','--json','bench-app-windows.json' -Wait -PassThru -NoNewWindow
          Get-Content bench-app-windows.json
          exit $p.ExitCode
      - name: Startup smoke test (window, first frame)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/blinzel.exe -ArgumentList 'testdata/generated/jpeg-24mp-420.jpg','--exit-after-first-frame','--json','bench-startup-windows.json' -Wait -PassThru -NoNewWindow
          if (Test-Path bench-startup-windows.json) { Get-Content bench-startup-windows.json }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bench-and-exe
          path: |
            bench-*.json
            target/release/blinzel.exe
            target/release/blinzel.pdb
            target/warp-golden/

  windows-arm64:
    name: Windows ARM64 (cross build)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: arm64
      - run: cargo build --release --target aarch64-pc-windows-msvc -p blinzel-app
      - name: Exe size
        shell: pwsh
        run: |
          $size = (Get-Item target/aarch64-pc-windows-msvc/release/blinzel.exe).Length
          "blinzel.exe (ARM64): {0:N0} bytes" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-exe
          path: target/aarch64-pc-windows-msvc/release/blinzel.exe
