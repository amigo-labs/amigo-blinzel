name: Site data

# Validates docs/site/ (the page on amigo-labs.dev) against the website's
# schema and fails when assets/brand/ (the app icons made from the pixel
# monogram) or crates/blinzel-ui/src/theme.rs (the shared amigo theme as a
# Rust module) no longer matches docs/site/project.yml. Regenerate in
# amigo-labs/website with
# `node scripts/monogram.ts amigo-labs/amigo-blinzel --out ../amigo-blinzel/assets/brand`
# and
# `node scripts/theme.ts amigo-labs/amigo-blinzel --out <scratch folder> --rust ../amigo-blinzel/crates/blinzel-ui/src/theme.rs`.

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "assets/brand/**"
      - "crates/blinzel-ui/src/theme.rs"
      - ".github/workflows/site-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-data:
    uses: amigo-labs/website/.github/workflows/validate-project.yml@main
    with:
      theme-rust: crates/blinzel-ui/src/theme.rs
