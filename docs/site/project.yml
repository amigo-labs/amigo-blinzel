# Content of amigo-labs.dev/blinzel/, read by the amigo-labs website at build
# time (format: amigo-labs/website docs/project-data.md). Versions, download
# links and release notes come from the GitHub releases, not from this file.
schema: 1
slug: blinzel
name: amigo-blinzel
status: released
accent: "#ff4757"
icon: icon.svg
tagline:
  en: Open images, page, resize.
  de: Bilder öffnen, blättern, verkleinern.
summary:
  en: An image viewer for Windows, macOS and Linux, built for short times when opening and paging through images. It also resizes many images at once and takes screenshots. No toolbars, no ads, no telemetry.
  de: Ein Bildbetrachter für Windows, macOS und Linux, ausgelegt auf kurze Zeiten beim Öffnen und Durchblättern. Er verkleinert auch viele Bilder auf einmal und macht Bildschirmfotos. Keine Leisten, keine Werbung, keine Telemetrie.
about:
  en: |
    There are no toolbars. The menu (☰) sits top left; everything else is in the menu or on a key. Image files stay unchanged: cutouts are only written as new files through “Save as”.

    Source code open on GitHub; no ads, no telemetry, the only network connection is the daily update check with GitHub (can be turned off: `auto_update = false` in `settings.toml`).
  de: |
    Die Oberfläche hat keine Leisten. Links oben sitzt das Menü (☰); alles andere steckt im Menü oder liegt auf einer Taste. Bilddateien bleiben unverändert: Ausschnitte entstehen nur über „Speichern unter“ als neue Datei.

    Quellcode offen auf GitHub; keine Werbung, keine Telemetrie, als einzige Netzwerkverbindung die tägliche Update-Prüfung bei GitHub (abschaltbar: `auto_update = false` in `settings.toml`).
platforms: [windows, macos, linux]
license: MIT

highlights:
  - value: "12×"
    label:
      en: faster opening than Windows Photos (90 ms vs. 1.12 s, 24 MP JPEG, median)
      de: schneller geöffnet als mit Windows Fotos (90 ms statt 1,12 s, 24-MP-JPEG, Median)
  - value: "18 ms"
    label:
      en: from key press to the next image (Windows, median)
      de: vom Tastendruck bis zum nächsten Bild (Windows, Median)
  - value: "4×"
    label:
      en: faster batch resizing than ImageMagick (8.6 vs. 2.1 photos per second)
      de: schneller verkleinert als mit ImageMagick (8,6 statt 2,1 Fotos pro Sekunde)
  - value: "8"
    label:
      en: image formats with our own decoders, on every platform
      de: Bildformate mit eigenen Decodern, auf jeder Plattform

features:
  - title: { en: Viewing, de: Betrachten }
    text:
      en: The window appears with the image already on it. Images are decoded only as large as the screen needs; the next images wait as GPU textures in the direction you page. Image files stay unchanged; cutouts are only written as new files through “Save as”, losslessly from JPEG where possible (also PNG, WebP, AVIF).
      de: Das Fenster erscheint erst mit dem Bild darauf. Decodiert wird nur so groß, wie der Bildschirm es braucht; die nächsten Bilder liegen in Blätterrichtung als GPU-Texturen bereit. Bilddateien bleiben unverändert; Ausschnitte entstehen nur über „Speichern unter“ als neue Datei, aus JPEG wenn möglich verlustfrei (auch PNG, WebP, AVIF).
  - title: { en: Resize many images, de: Viele Bilder verkleinern }
    text:
      en: Ctrl+B (⌘B on a Mac) opens the dialog; drag images and folders into it. Long edge, width, height, fit into or fill a box, or percent, scaled with Lanczos3 in linear light; JPEG, PNG, WebP or AVIF. EXIF and the colour profile are kept, GPS can be removed. A name pattern shows every new name in advance. Source files are never overwritten. All cores work in parallel — 8.6 photos per second (12 MP to 1920 px, 4 cores) against 2.1 with ImageMagick.
      de: Strg+B (auf dem Mac ⌘B) öffnet den Dialog; Bilder und Ordner hineinziehen. Längste Kante, Breite, Höhe, Rahmen einpassen oder füllen oder Prozent, skaliert mit Lanczos3 in linearem Licht; JPEG, PNG, WebP oder AVIF. EXIF und Farbprofil bleiben erhalten, GPS lässt sich entfernen. Ein Namensmuster zeigt jeden neuen Namen vorab. Quelldateien werden nie überschrieben. Alle Kerne arbeiten parallel — 8,6 Fotos pro Sekunde (12 MP auf 1920 px, 4 Kerne) gegenüber 2,1 mit ImageMagick.
  - title: { en: Screenshots (Windows and macOS), de: Bildschirmfotos (Windows und macOS) }
    text:
      en: The Print key, on a Mac ⌘⇧1, freezes the screen across all monitors while amigo-blinzel stays ready in the background. Drag a region, click a window or press Enter for the whole screen. The screenshot goes to the clipboard and, as set, as PNG into “Pictures\Screenshots”, the viewer and the editor of your choice.
      de: Die Druck-Taste, auf dem Mac ⌘⇧1, friert den Bildschirm über alle Monitore ein, solange amigo-blinzel im Hintergrund bereitsteht. Bereich aufziehen, Fenster anklicken oder Enter für den ganzen Bildschirm. Das Foto kommt in die Zwischenablage und je nach Einstellung als PNG nach „Bilder\Screenshots“, in den Viewer und in den Editor deiner Wahl.
  - title: { en: Formats, de: Formate }
    text:
      en: Our own decoders on every platform for JPEG, PNG, GIF, BMP, TIFF, WebP, AVIF and JPEG XL. HEIC and camera RAW through the system — the installed Windows codecs on Windows, ImageIO on macOS (HEIC with Apple's hardware decoder), and RAW through the embedded previews on Linux.
      de: Eigene Decoder auf jeder Plattform für JPEG, PNG, GIF, BMP, TIFF, WebP, AVIF und JPEG XL. HEIC und Kamera-RAW über das System — unter Windows über die installierten Windows-Codecs, unter macOS über ImageIO (HEIC mit Apples Hardware-Decoder), unter Linux RAW über die eingebetteten Vorschauen.
  - title: { en: Grid and editing elsewhere, de: Raster und Bearbeiten woanders }
    text:
      en: G shows a grid of all images, Ctrl+click marks them. E hands the image to the editor you chose (e.g. Paint.NET, GIMP, Photoshop); “Open with…” is in the menu. Delete moves an image to the Recycle Bin.
      de: G zeigt ein Raster aller Bilder, Strg+Klick markiert sie. E gibt das Bild an den Editor deiner Wahl (z. B. Paint.NET, GIMP, Photoshop); „Öffnen mit…“ steht im Menü. Entf verschiebt ein Bild in den Papierkorb.
  - title: { en: Updates without asking, de: Updates ohne Nachfrage }
    text:
      en: Installs for you only, without administrator rights. amigo-blinzel asks GitHub at most once a day whether there is a new version and installs it silently; it takes effect at the next start. It can be turned off.
      de: Installation nur für dich, ohne Administratorrechte. amigo-blinzel prüft höchstens einmal am Tag bei GitHub, ob es eine neue Version gibt, und installiert sie still; aktiv wird sie beim nächsten Start. Abschaltbar.

sections:
  - id: how-it-works
    title: { en: How it works, de: Technik }
    body:
      en: |
        - Decoding at screen resolution: JPEGs are decoded with DCT scaling straight into YCbCr planes; the GPU does colour conversion and scaling.
        - An own JPEG decoder spreads Huffman decoding over all cores, even without restart markers, and is byte-identical with libjpeg-turbo.
        - Prefetching in paging direction, with priorities and cancellation.
        - Parallel start: window, GPU and decoder start at the same time.
        - Native on every platform: Win32 and Direct3D 11 on Windows, AppKit and Metal on macOS, Vulkan (wgpu) on Linux. No runtime, no framework in between.
      de: |
        - Decodieren in Bildschirmauflösung: JPEGs werden per DCT-Skalierung direkt in YCbCr-Ebenen decodiert; Farbumrechnung und Skalierung übernimmt die Grafikkarte.
        - Ein eigener JPEG-Decoder verteilt das Huffman-Decoding auf alle Kerne, auch ohne Restart-Marker, und liefert byte-genau dasselbe wie libjpeg-turbo.
        - Prefetch in Blätterrichtung, mit Prioritäten und Abbruch.
        - Paralleler Start: Fenster, Grafikkarte und Decoder starten gleichzeitig.
        - Nativ auf jeder Plattform: Win32 und Direct3D 11 unter Windows, AppKit und Metal unter macOS, Vulkan (wgpu) unter Linux. Keine Runtime, kein Framework dazwischen.

