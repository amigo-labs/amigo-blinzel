downloads:
  files:
    - os: windows
      label: { en: Viewer and installer, de: Viewer und Installer }
      arch: x64
      asset: amigo-blinzel-setup-x64.exe
      note: { en: Windows 11 version 24H2 or newer., de: Windows 11 ab Version 24H2. }
    - os: windows
      label: { en: Viewer and installer, de: Viewer und Installer }
      arch: arm64
      asset: amigo-blinzel-setup-arm64.exe
      note: { en: Windows 11 version 24H2 or newer., de: Windows 11 ab Version 24H2. }
    - os: macos
      label: DMG
      arch: universal
      asset: amigo-blinzel-macos.dmg
      note: { en: "macOS 14 Sonoma or newer, Apple silicon and Intel in one app.", de: "macOS 14 Sonoma oder neuer, Apple Silicon und Intel in einer App." }
    - os: linux
      label: tar.gz
      arch: x64
      asset: amigo-blinzel-linux-x64.tar.gz
      note: { en: "Wayland or X11, glibc 2.35 or newer, a Vulkan or OpenGL ES 3 driver.", de: "Wayland oder X11, glibc ab 2.35, Vulkan- oder OpenGL-ES-3-Treiber." }
    - os: linux
      label: tar.gz
      arch: arm64
      asset: amigo-blinzel-linux-arm64.tar.gz
      note: { en: "Wayland or X11, glibc 2.35 or newer, a Vulkan or OpenGL ES 3 driver.", de: "Wayland oder X11, glibc ab 2.35, Vulkan- oder OpenGL-ES-3-Treiber." }
  checksums: SHA256SUMS
  install:
    - label: { en: Linux (after downloading), de: Linux (nach dem Download) }
      command: tar xzf amigo-blinzel-linux-x64.tar.gz && ./amigo-blinzel/blinzel --install
  guide:
    windows:
      en: |
        The file is viewer and installer in one and installs for you only, without administrator rights, to `%LOCALAPPDATA%\Programs\amigo-blinzel`.

        The file is not signed with a code signing certificate, so Windows SmartScreen shows “Windows protected your PC” at the first start: click *More info*, then *Run anyway*. To make amigo-blinzel the default for images, use Windows Settings; the setup opens the page if you like. Uninstall: Settings → Apps → Installed apps.
      de: |
        Die Datei ist Viewer und Installer zugleich und installiert sich nur für dich, ohne Administratorrechte, nach `%LOCALAPPDATA%\Programs\amigo-blinzel`.

        Die Datei ist nicht mit einem Code-Signing-Zertifikat signiert. Windows SmartScreen zeigt deshalb beim ersten Start „Der Computer wurde durch Windows geschützt“: auf *Weitere Informationen* und dann *Trotzdem ausführen* klicken. Als Standard-App für Bilder legst du amigo-blinzel danach in den Windows-Einstellungen fest; das Setup öffnet die Seite auf Wunsch. Deinstallieren: Einstellungen → Apps → Installierte Apps.
    macos:
      en: |
        Open the DMG and drag `amigo-blinzel.app` onto the Applications folder.

        The app is not notarized by Apple, so macOS reports at the first start that it cannot check it. On macOS 14: Control-click the app in Finder, choose *Open* and confirm. From macOS 15: open the app once and close the message with *Done*, then in System Settings → Privacy & Security, at the bottom next to “amigo-blinzel”, click *Open Anyway* and confirm with your password. This is needed for the first start only; the app downloads updates itself, without this prompt. Or in Terminal:

        ```sh
        xattr -dr com.apple.quarantine /Applications/amigo-blinzel.app
        ```

        Make it the default through “Get Info” → “Open with” → “Change All”.
      de: |
        Die DMG öffnen und `amigo-blinzel.app` auf den Ordner „Programme“ ziehen.

        Die App ist nicht von Apple notarisiert. macOS meldet deshalb beim ersten Öffnen, dass die App nicht geprüft werden kann. Unter macOS 14: im Finder mit gedrückter Ctrl-Taste auf die App klicken, *Öffnen* wählen und bestätigen. Ab macOS 15: die App einmal öffnen und die Meldung mit *Fertig* schließen, dann in Systemeinstellungen → Datenschutz & Sicherheit ganz unten bei „amigo-blinzel“ auf *Trotzdem öffnen* klicken und mit dem Passwort bestätigen. Das ist nur beim ersten Start nötig; Updates lädt die App selbst und ohne diese Abfrage. Alternativ im Terminal:

        ```sh
        xattr -dr com.apple.quarantine /Applications/amigo-blinzel.app
        ```

        Zur Standard-App wird sie über „Informationen“ → „Öffnen mit“ → „Alle ändern“.
    linux:
      en: |
        ```sh
        tar xzf amigo-blinzel-linux-x64.tar.gz
        ./amigo-blinzel/blinzel --install
        ```

        This puts the program in `~/.local/share/amigo-blinzel`, a `blinzel` command in `~/.local/bin` and an entry in the application menu with “Open with” for images. To make it the default image viewer: `xdg-mime default amigo-blinzel.desktop image/jpeg image/png image/webp image/avif`. Uninstall: `blinzel --uninstall`.
      de: |
        ```sh
        tar xzf amigo-blinzel-linux-x64.tar.gz
        ./amigo-blinzel/blinzel --install
        ```

        Das legt das Programm nach `~/.local/share/amigo-blinzel`, einen Aufruf `blinzel` nach `~/.local/bin` und einen Eintrag ins Anwendungsmenü mit „Öffnen mit“ für Bilder. Als Standard-Bildbetrachter: `xdg-mime default amigo-blinzel.desktop image/jpeg image/png image/webp image/avif`. Deinstallieren: `blinzel --uninstall`.
    all:
      en: |
        **Checksums:** the checksums of all files are in SHA256SUMS, signed with the project's release key. On Windows: `Get-FileHash amigo-blinzel-setup-x64.exe`; on macOS and Linux: `shasum -a 256` or `sha256sum`.

        **Updates:** amigo-blinzel asks GitHub at most once a day whether there is a new version and installs it silently; it takes effect at the next start. To turn it off: `auto_update = false` in `settings.toml`, on Windows in `%APPDATA%\amigo-blinzel`, on macOS in `~/Library/Application Support/amigo-blinzel`, on Linux in `~/.config/amigo-blinzel`.
      de: |
        **Prüfsummen:** Die Prüfsummen aller Dateien stehen in SHA256SUMS, signiert mit dem Release-Schlüssel des Projekts. Unter Windows: `Get-FileHash amigo-blinzel-setup-x64.exe`, unter macOS und Linux: `shasum -a 256` bzw. `sha256sum`.

        **Updates:** amigo-blinzel prüft höchstens einmal am Tag bei GitHub, ob es eine neue Version gibt, und installiert sie still; aktiv wird sie beim nächsten Start. Abschalten: `auto_update = false` in der Datei `settings.toml`, unter Windows in `%APPDATA%\amigo-blinzel`, unter macOS in `~/Library/Application Support/amigo-blinzel`, unter Linux in `~/.config/amigo-blinzel`.
