[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored third-party crates are patches, not members (no fmt/clippy gate).
exclude = ["third_party/*"]
default-members = ["crates/blinzel-core", "crates/blinzel-jpeg", "crates/blinzel-i18n", "crates/blinzel-bench", "crates/blinzel-ui", "crates/blinzel-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
blinzel-core = { path = "crates/blinzel-core", default-features = false }
blinzel-jpeg = { path = "crates/blinzel-jpeg" }
blinzel-i18n = { path = "crates/blinzel-i18n" }
blinzel-ui = { path = "crates/blinzel-ui", default-features = false }
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake", "require-simd"] }
zune-jpeg = "0.5.15"
zune-png = "0.5.2"
zune-core = "0.5"
png = "0.18"
gif = "0.14"
image-webp = "0.2.4"
jxl-oxide = "0.12.6"
jxl-render = "0.12.4"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
zune-jpegxl = "0.5.2"
zune-heic = "0.5.0"
# AV1 for AVIF; blinzel-core's `av1-asm` feature adds dav1d's assembly.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# Batch encoders: WebP (libwebp, built with cc) and AVIF (rav1e). rav1e's
# assembly is added by blinzel-core's `av1-asm` feature, like dav1d's.
libwebp-sys = "0.14.4"
ravif = { version = "0.13.0", default-features = false }
# The Linux shell: window and input (Wayland, X11), rendering (Vulkan,
# OpenGL ES), text, file dialogs, clipboard, recycle bin, folder watching,
# colour transforms.
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
pollster = "1.0.1"
cosmic-text = "0.19.0"
rfd = "0.17.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
trash = "5.2.9"
notify = "8.2.0"
lcms2 = "6.2.0"
x11rb = { version = "0.13.2", default-features = false, features = ["randr"] }
# The macOS shell: AppKit, Metal, Core Text, ImageIO through the objc2
# bindings; notify and lcms2 as on Linux.
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-image-io = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
# Only in the benches: the resampler gate.
fast_image_resize = "6.1.0"
# Verifies our own signature of release checksums (self-updater).
ed25519-compact = { version = "2.1", default-features = false }
toml = "0.9"
windows = "0.62"
windows-sys = "0.61"
windows-numerics = "0.3"

# cmake-rs drops CMake's optimization flags on MSVC; see
# third_party/cmake-rs/README.md.
[patch.crates-io]
cmake = { path = "third_party/cmake-rs" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: every decode job runs in catch_unwind so one broken file
# cannot take the viewer down.
panic = "unwind"
debug = "line-tables-only"

# Build libjpeg-turbo as CMake "Release" (/O2 /Ob2, -O3) instead of
# "RelWithDebInfo" (/Ob1 limits inlining on MSVC).
[profile.release.package.turbojpeg-sys]
debug = false

# JPEG XL: optimized for size (see docs/PLAN.md, JPEG XL gate).
[profile.release.package.jxl-bitstream]
opt-level = "s"

[profile.release.package.jxl-coding]
opt-level = "s"

[profile.release.package.jxl-color]
opt-level = "s"

[profile.release.package.jxl-frame]
opt-level = "s"

[profile.release.package.jxl-grid]
opt-level = "s"

[profile.release.package.jxl-image]
opt-level = "s"

[profile.release.package.jxl-jbr]
opt-level = "s"

[profile.release.package.jxl-modular]
opt-level = "s"

[profile.release.package.jxl-oxide]
opt-level = "s"

[profile.release.package.jxl-oxide-common]
opt-level = "s"

[profile.release.package.jxl-render]
opt-level = "s"

[profile.release.package.jxl-threadpool]
opt-level = "s"

[profile.release.package.jxl-vardct]
opt-level = "s"

[profile.bench]
inherits = "release"

# Decoders and test-image generation are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

# The decoder is unusable unoptimized, and its integer IDCT wraps on corrupt
# input exactly like libjpeg's C code instead of panicking.
[profile.dev.package.blinzel-jpeg]
opt-level = 3
overflow-checks = false

[profile.test.package.blinzel-jpeg]
opt-level = 3
overflow-checks = false
