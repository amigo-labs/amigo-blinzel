[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored third-party crates are patches, not members (no fmt/clippy gate).
exclude = ["third_party/*"]
default-members = ["crates/blinzel-core", "crates/blinzel-jpeg", "crates/blinzel-i18n", "crates/blinzel-bench", "crates/blinzel-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
blinzel-core = { path = "crates/blinzel-core", default-features = false }
blinzel-jpeg = { path = "crates/blinzel-jpeg" }
blinzel-i18n = { path = "crates/blinzel-i18n" }
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake", "require-simd"] }
zune-jpeg = "0.5.16-rc3"
zune-png = "0.5.2"
zune-core = "0.5"
png = "0.18"
gif = "0.14"
toml = "0.9"
windows = "0.62"
windows-sys = "0.61"
windows-numerics = "0.3"

# cmake-rs drops CMake's optimization flags on MSVC; see
# third_party/cmake-rs/README.md.
[patch.crates-io]
cmake = { path = "third_party/cmake-rs" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: every decode job runs in catch_unwind so one broken file
# cannot take the viewer down.
panic = "unwind"
debug = "line-tables-only"

# Build libjpeg-turbo as CMake "Release" (/O2 /Ob2, -O3) instead of
# "RelWithDebInfo" (/Ob1 limits inlining on MSVC).
[profile.release.package.turbojpeg-sys]
debug = false

[profile.bench]
inherits = "release"

# Decoders and test-image generation are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

# The decoder is unusable unoptimized, and its integer IDCT wraps on corrupt
# input exactly like libjpeg's C code instead of panicking.
[profile.dev.package.blinzel-jpeg]
opt-level = 3
overflow-checks = false

[profile.test.package.blinzel-jpeg]
opt-level = 3
overflow-checks = false
