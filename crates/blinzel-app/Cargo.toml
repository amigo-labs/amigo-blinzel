[package]
name = "blinzel-app"
description = "amigo-blinzel for Windows: Win32 window, Direct3D 11 renderer, prefetching viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "blinzel"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["turbojpeg"]
turbojpeg = ["blinzel-core/turbojpeg", "blinzel-ui/turbojpeg"]
# Native HEIC where Windows has no HEVC codec; see blinzel-core's `heic`.
heic = ["blinzel-core/heic"]

[dependencies]
blinzel-core.workspace = true
blinzel-i18n.workspace = true
blinzel-jpeg.workspace = true
blinzel-ui.workspace = true

# AVIF with dav1d's assembly on x86-64. ARM64 uses the Rust fallbacks: the
# published rav1d lacks the header its ARM assembly includes
# (src/arm/asm-offsets.h), and MSVC cannot build it anyway.
[target.'cfg(target_arch = "x86_64")'.dependencies]
blinzel-core = { workspace = true, features = ["av1-asm"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
cosmic-text.workspace = true
rfd.workspace = true
arboard.workspace = true
trash.workspace = true
notify.workspace = true
lcms2.workspace = true
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-image-io.workspace = true
block2.workspace = true
dispatch2.workspace = true
notify.workspace = true
lcms2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-numerics.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Encodes the generated application icon.
png.workspace = true

[dev-dependencies]
png.workspace = true
