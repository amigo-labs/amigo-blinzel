[package]
name = "blinzel-core"
description = "Platform-independent viewer core: decoding, layout, selection, scheduling, caching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["turbojpeg"]
# libjpeg-turbo as the JPEG baseline until blinzel-jpeg beats it (M3).
turbojpeg = ["dep:turbojpeg-sys"]
# dav1d's assembly for AVIF: needs NASM, and only builds on x86-64 (MSVC
# cannot assemble the ARM64 files). The app and the benches enable it there.
av1-asm = ["rav1d/asm"]
# Our own HEVC decoder for HEIC (zune-heic). Off by default: HEVC is
# covered by patents, so release builds leave HEIC to Windows' codec.
heic = ["dep:zune-heic"]

[dependencies]
blinzel-jpeg.workspace = true
turbojpeg-sys = { workspace = true, optional = true }
png.workspace = true
gif.workspace = true
image-webp.workspace = true
jxl-oxide.workspace = true
jxl-render.workspace = true
tiff.workspace = true
zune-heic = { workspace = true, optional = true }
rav1d.workspace = true
ed25519-compact.workspace = true

[dev-dependencies]
zune-jpegxl.workspace = true
zune-core.workspace = true
