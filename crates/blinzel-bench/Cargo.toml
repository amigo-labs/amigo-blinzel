[package]
name = "blinzel-bench"
description = "Test corpus generator and library-vs-own-code benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The benches measure the optional HEIC decoder too (not distributed).
blinzel-core = { workspace = true, features = ["turbojpeg", "heic"] }
blinzel-jpeg.workspace = true
zune-jpeg.workspace = true
zune-png.workspace = true
zune-core.workspace = true
png.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
blinzel-core = { workspace = true, features = ["av1-asm"] }
