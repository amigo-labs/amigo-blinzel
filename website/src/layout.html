<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0c">
<title>{{title}} · amigo-blinzel</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="de" href="{{url_de}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="x-default" href="{{site}}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="amigo-blinzel">
<meta property="og:title" content="{{title}} · amigo-blinzel">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/site.js" defer></script>
</head>
<body class="page-{{slug}}">
<a class="skip" href="#main">{{skip}}</a>
<header class="site-header">
<div class="bar">
<a class="brand" href="/{{lang}}/"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path class="lid" d="M5 16c3-5.5 7-8 11-8s8 2.5 11 8c-3 5.5-7 8-11 8s-8-2.5-11-8z" fill="#fff"/><circle class="pupil" cx="16" cy="16" r="4.5"/></svg><span>amigo-blinzel</span></a>
<nav>{{nav}}</nav>
<a class="lang" href="{{other_lang_url}}" hreflang="{{other_lang}}" lang="{{other_lang}}">{{other_lang_name}}</a>
</div>
</header>
<main id="main">
{{heading}}
{{content}}
</main>
<footer class="site-footer">
<div class="foot">
<p class="foot-brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M5 16c3-5.5 7-8 11-8s8 2.5 11 8c-3 5.5-7 8-11 8s-8-2.5-11-8z" fill="#fff"/><circle class="pupil" cx="16" cy="16" r="4.5"/></svg><span>amigo-blinzel {{version}}</span></p>
<p class="foot-links">{{footer}}<a href="https://github.com/amigo-labs/amigo-blinzel">GitHub</a></p>
</div>
</footer>
</body>
</html>
